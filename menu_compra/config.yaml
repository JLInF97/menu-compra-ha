name: "Menú y Compra"
version: "1.0.0"
slug: "menu_compra"
url: "https://github.com/JLInF97/menu-compra-ha"
description: "Menú semanal, lista de la compra e historial de precios compartidos."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
# python:3.12-slim no incluye S6: el Supervisor proporciona el proceso init.
init: true
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: "Menú y compra"
panel_admin: false
# SQLite se copia con la aplicación detenida.
backup: cold
environment:
  MENU_COMPRA_DATA_DIR: /data
options: {}
schema: {}
