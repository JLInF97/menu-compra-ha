<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Tu menú semanal con varios platos, tus productos y la lista de la compra, en casa.">
  <title>Menú y Compra</title>
  <link rel="icon" type="image/x-icon" href="static/favicon.ico?v=1.0.0">
  <link rel="icon" type="image/png" sizes="32x32" href="static/icons/icon-32.png?v=1.0.0">
  <link rel="icon" type="image/png" sizes="192x192" href="static/icons/icon-192.png?v=1.0.0">
  <link rel="icon" type="image/png" sizes="512x512" href="static/icons/icon-512.png?v=1.0.0">
  <link rel="apple-touch-icon" sizes="180x180" href="static/icons/icon-180.png?v=1.0.0">
  <link rel="stylesheet" href="static/style.css?v=1.0.0">
  <script src="static/app.js?v=1.0.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand" aria-label="Menú y Compra">
        <span class="brand-mark" aria-hidden="true">
          <img src="static/icons/icon-192.png?v=1.0.0" width="48" height="48" alt="" decoding="async">
        </span>
        <span><strong>Menú y Compra</strong><small>Un poco de orden, cada día.</small></span>
      </div>
      <nav class="main-nav" aria-label="Secciones principales">
        <button type="button" data-view="menu" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label-desktop">Menú semanal</span><span class="nav-label-mobile">Menú</span></button>
        <button type="button" data-view="shopping"><span class="nav-icon" aria-hidden="true">☑</span><span class="nav-label-desktop">Lista de la compra</span><span class="nav-label-mobile">Compra</span><span id="shopping-nav-count" class="nav-count" hidden></span></button>
        <button type="button" data-view="products"><span class="nav-icon" aria-hidden="true">▤</span><span>Productos</span><span id="products-nav-count" class="nav-count" hidden></span></button>
      </nav>
      <div class="sidebar-bottom">
        <button type="button" id="settings-button" class="settings-button" aria-label="Datos y ajustes"><span aria-hidden="true">⚙</span> Datos y ajustes</button>
        <p class="local-note"><span class="status-dot" aria-hidden="true"></span> En tu Home Assistant<br><span>Sin servicios externos.</span></p>
      </div>
    </aside>
    <div class="workspace">
      <header class="page-header">
        <div><p class="eyebrow" id="page-eyebrow">Organiza la semana</p><h1 id="page-title">Menú semanal</h1><p class="page-description" id="page-description" hidden></p></div>
        <div id="page-actions" class="page-actions"></div>
      </header>
      <main id="main-content" tabindex="-1" aria-busy="true">
        <div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><p>Cargando tus datos…</p></div>
      </main>
      <footer class="app-footer">Menú y Compra <span aria-hidden="true">·</span> <span id="app-version">v1.0.0</span></footer>
    </div>
  </div>
  <button type="button" id="shopping-fab" class="shopping-fab" aria-label="Añadir a la lista" hidden>+</button>
  <div id="notifications" class="notifications" role="status" aria-live="polite" aria-atomic="false"></div>
  <noscript><div class="noscript">Activa JavaScript para utilizar Menú y Compra.</div></noscript>
</body>
</html>
