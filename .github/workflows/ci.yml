name: Pruebas de Menú y Compra

on:
  push:
  pull_request:
  workflow_dispatch:

# No se publican imágenes ni releases ni se necesitan secretos del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Python ${{ matrix.python }} · Chromium · paquetes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Usar temporales propios del runner
        run: |
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # SHA de los tags oficiales verificados mediante la API pública de GitHub.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Ruff, portabilidad, sintaxis JavaScript y arranque POSIX
        run: |
          python -m ruff check .
          python tools/check_portability.py
          npm run check:js
          sh -n menu_compra/run.sh
      - name: Suite Python y schemas probatio reales
        run: |
          mkdir -p build/test-evidence
          python -c "import probatio; print('probatio importado correctamente')"
          python -m pytest -q --junitxml=build/test-evidence/pytest.xml
      - name: Regresión y enlace automático con Chromium real
        run: npm run test:browser
      - name: Crear paquetes nuevos sin modificar dist
        run: python tools/build_release.py --output-dir build/ci-dist
      - name: Extraer y verificar paquetes con Chromium real
        env:
          MENU_COMPRA_VERIFY_UI: '1'
        run: python tools/verify_release.py --dist-dir build/ci-dist --evidence-dir build/ci-release-evidence
      - name: Conservar resultados y paquetes de esta ejecución
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pruebas-python-${{ matrix.python }}
          path: |
            build/test-evidence/
            build/browser-evidence/
            build/ci-dist/
            build/ci-release-evidence/
          if-no-files-found: warn
          retention-days: 14

  contenedor:
    name: Contenedor Linux ${{ matrix.arch }} · producción
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Emular arm64 únicamente cuando es necesario
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local push=false y smoke sin puertos ni modo desarrollo
        run: python tools/check_container.py --platform linux/${{ matrix.arch }} --output build/container-${{ matrix.arch }}.json
      - name: Conservar informe del smoke
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contenedor-${{ matrix.arch }}
          path: build/container-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 14
